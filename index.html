        class Explosive {
            constructor(type, x, y, owner, targetX=0, targetY=0) {
                this.type = type; this.x = x; this.y = y; this.owner = owner; this.active = true;
                if (type === 'grenade') {
                    this.timer = 1000; let angle = Math.atan2(targetY - y, targetX - x); let dist = Math.min(600, Math.hypot(targetX - x, targetY - y)); 
                    this.vx = Math.cos(angle) * (dist / 60); this.vy = Math.sin(angle) * (dist / 60);
                } else if (type === 'mine') { this.timer = -1; 
                } else if (type === 'explosion') { this.timer = 300; this.radius = 120; this.damagedTargets = []; }
            }
            update(dt) {
                if (!this.active) return;
                if (this.type === 'grenade') {
                    this.x += this.vx; this.y += this.vy; this.timer -= dt;
                    if (this.timer <= 0) { this.active = false; explosives.push(new Explosive('explosion', this.x, this.y, this.owner)); }
                } else if (this.type === 'mine') {
                    for(let t of [player, ...others]) {
                        if (t && t.hp > 0 && !t.isDeadProcessed && t.team !== this.owner.team && t.realm === this.owner.realm) {
                            if(Math.hypot(this.x - t.x, this.y - t.y) < t.radius + 15) { this.active = false; explosives.push(new Explosive('explosion', this.x, this.y, this.owner)); break; }
                        }
                    }
                } else if (this.type === 'explosion') {
                    this.timer -= dt; if (this.timer <= 0) this.active = false;
                    else {
                        for(let t of [player, ...others]) {
                            if (t && t.hp > 0 && t.invincibleTimer <= 0 && t.team !== this.owner.team && !this.damagedTargets.includes(t) && t.realm === this.owner.realm) {
                                if(Math.hypot(this.x - t.x, this.y - t.y) < this.radius + t.radius) {
                                    let dmg = 40; if(t.heroType === 'hexagon' && t.ultActiveTimer > 0) dmg *= 0.8;
                                    t.hp -= dmg; this.damagedTargets.push(t); 
                                    if(t.hp <= 0 && !t.isDeadProcessed) { t.isDeadProcessed = true; handleDeath(t, this.owner); }
                                }
                            }
                        }
                    }
                }
            }
            draw(ctx) {
                if (!this.active) return;
                if (this.type === 'grenade') { ctx.beginPath(); ctx.arc(this.x, this.y, 8, 0, Math.PI*2); ctx.fillStyle = '#4b5563'; ctx.fill(); } 
                else if (this.type === 'mine') { ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI*2); ctx.fillStyle = this.owner.team === 'blue' ? '#3b82f6' : '#ef4444'; ctx.fill(); } 
                else if (this.type === 'explosion') { let alpha = this.timer / 300; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`; ctx.fill(); }
            }
        }

        class MeleeSlash {
            constructor(x, y, angle, radius, spread, color, owner) {
                this.x = x; this.y = y; this.angle = angle; this.radius = radius; this.spread = spread;
                this.color = color; this.owner = owner; this.timer = 150; this.active = true; this.damaged = [];
            }
            update(dt) {
                this.timer -= dt; if(this.timer <= 0) { this.active = false; return; }
                this.x = this.owner.x; this.y = this.owner.y;
                for (let t of [player, ...others]) {
                    if (t && t.hp > 0 && !t.isDeadProcessed && t.team !== this.owner.team && !this.damaged.includes(t) && this.owner.realm === t.realm) {
                        let dist = Math.hypot(t.x - this.x, t.y - this.y);
                        if (dist < this.radius + t.radius) {
                            let angleToT = Math.atan2(t.y - this.y, t.x - this.x);
                            let diff = Math.abs(angleToT - this.angle); while(diff > Math.PI) diff -= Math.PI*2;
                            if (Math.abs(diff) <= this.spread / 2) {
                                let baseDmg = (this.owner.heroType === 'square') ? 35 : 25;
                                let dmg = baseDmg; 
                                if(t.heroType === 'hexagon' && t.ultActiveTimer > 0) dmg *= 0.8;
                                t.hp -= dmg; this.damaged.push(t);
                                
                                if (this.owner.heroType === 'square') {
                                    let lifesteal = this.owner.ultActiveTimer > 0 ? 20 : 10;
                                    this.owner.hp = Math.min(this.owner.maxHp, this.owner.hp + lifesteal);
                                }

                                if (!this.owner.isBot && !this.owner.isRemote) { this.owner.ultGauge = Math.min(100, this.owner.ultGauge + 5); updateUI(); }
                                if(t.hp <= 0 && !t.isDeadProcessed) { t.isDeadProcessed = true; handleDeath(t, this.owner); }
                            }
                        }
                    }
                }
            }
            draw(ctx) {
                if(!this.active) return;
                let alpha = this.timer / 150;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.arc(this.x, this.y, this.radius, this.angle - this.spread/2, this.angle + this.spread/2); ctx.closePath();
                ctx.fillStyle = this.color.replace(')', `, ${alpha * 0.5})`).replace('rgb', 'rgba');
                if(this.color.startsWith('#')) ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fill();
            }
        }

        class Projectile {
            constructor(x, y, angle, color, owner) {
                this.x = x; this.y = y; this.radius = 6; this.speed = (owner.heroType === 'triangle') ? 10 : 15;
                this.vx = Math.cos(angle) * this.speed; this.vy = Math.sin(angle) * this.speed;
                this.color = color; this.owner = owner; 
                this.damage = (owner.heroType === 'triangle') ? 10 : 15; 
                this.active = true; this.distanceTraveled = 0;
            }
            update() {
                let moveDist = Math.hypot(this.vx, this.vy);
                this.x += this.vx; this.y += this.vy; this.distanceTraveled += moveDist;
                
                if (this.owner.heroType === 'triangle' && this.distanceTraveled > 350) { this.active = false; return; }

                if (this.owner.realm) {
                    if (Math.hypot(this.x - this.owner.realm.x, this.y - this.owner.realm.y) > this.owner.realm.radius) { this.active = false; return; }
                } else {
                    if (this.x < 0 || this.x > MAP_WIDTH || this.y < 0 || this.y > MAP_HEIGHT) { this.active = false; return; }
                }
                
                for(let c of supplyCrates) { if(c.dropZ <= 0 && Math.hypot(this.x - c.x, this.y - c.y) < c.radius) { this.active = false; return; } }
                for (let rect of containers) { if (this.x > rect.x && this.x < rect.x + rect.w && this.y > rect.y && this.y < rect.y + rect.h) { this.active = false; return; } }
            }
            draw(ctx) { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); }
        }

        class Player {
            constructor(team, isBot = false, heroType = 'circle', name = '용사') {
                this.team = team; this.isBot = isBot; this.heroType = heroType; this.name = name;
                const config = HEROES[heroType] || HEROES['circle'];
                
                this.radius = 22; this.color = team === 'blue' ? '#3b82f6' : '#ef4444'; 
                this.baseSpeed = config.baseSpeed; this.maxHp = config.maxHp; this.baseCooldown = config.cooldown;
                this.shape = config.shape;
                
                this.inventory = { mine: 0, grenade: 0 };
                this.facingAngle = 0; this.realm = null; this.ultGauge = 0; this.flashCooldown = 0;
                this.isRemote = false; 
                this.spawn();
            }
            spawn() {
                this.hp = this.maxHp; this.speed = this.baseSpeed; this.vx = 0; this.vy = 0; 
                this.slowTimer = 0; this.lastAttackTime = 0; this.attackCooldown = this.baseCooldown; this.invincibleTimer = 3000;
                this.ultActiveTimer = 0; this.lastUltFireTime = 0; this.buffStacks = 0; this.realm = null;
                this.isDeadProcessed = false; 
                
                if (this.team === 'blue') { this.x = Math.random() * 200 + 150; this.y = Math.random() * 800 + (MAP_HEIGHT/2 - 400); } 
                else { this.x = MAP_WIDTH - (Math.random() * 200 + 150); this.y = Math.random() * 800 + (MAP_HEIGHT/2 - 400); }
                this.targetX = this.x; this.targetY = this.y;
            }
            update(dt) {
                if(this.invincibleTimer > 0) this.invincibleTimer -= dt;
                if(this.flashCooldown > 0) this.flashCooldown -= dt;

                // 🚨 핵심 교정 3-1: 상대방(원격 플레이어)도 화면상에서 궁극기 로직을 똑같이 실행하도록 위로 올림
                if (this.ultActiveTimer > 0) {
                    this.ultActiveTimer -= dt;
                    if (this.heroType === 'circle') {
                        const now = Date.now();
                        if (now - this.lastUltFireTime > 50) {
                            this.lastUltFireTime = now; let target = null; let minDist = Infinity;
                            for (let t of [player, ...others]) {
                                if (t && t.hp > 0 && t.team !== this.team && t.realm === this.realm) { let d = Math.hypot(t.x - this.x, t.y - this.y); if (d < minDist) { minDist = d; target = t; } }
                            }
                            if (target) {
                                let angle = Math.atan2(target.y - this.y, target.x - this.x) + (Math.random() - 0.5) * 0.25;
                                projectiles.push(new Projectile(this.x, this.y, angle, '#38bdf8', this));
                            }
                        }
                    } else if (this.heroType === 'hexagon') {
                        const now = Date.now();
                        if (now - this.lastUltFireTime > 200) { this.lastUltFireTime = now; meleeSlashes.push(new MeleeSlash(this.x, this.y, 0, 100, Math.PI*2, '#fde047', this)); }
                    } else if (this.heroType === 'square') {
                        for (let t of [player, ...others]) {
                            if (t && t.realm === this.realm && Math.hypot(t.x - this.x, t.y - this.y) <= 150) {
                                if (t.team === this.team) t.hp = Math.min(t.maxHp, t.hp + 15 * (dt/1000));
                                else { 
                                    t.hp -= 15 * (dt/1000); 
                                    if(t.hp <= 0 && !t.isDeadProcessed) { t.isDeadProcessed = true; handleDeath(t, this); } 
                                }
                            }
                        }
                    }
                    if (this.ultActiveTimer <= 0 && this === player) updateUI();
                }

                if (this.isRemote && !this.isDeadProcessed) {
                    if (this.targetX !== undefined && !Number.isNaN(this.targetX)) this.x += (this.targetX - this.x) * 0.2;
                    if (this.targetY !== undefined && !Number.isNaN(this.targetY)) this.y += (this.targetY - this.y) * 0.2;
                    return; 
                }
                
                let speedMult = 1.0; let coolMult = 1.0;
                if (this.realm && this.heroType === 'triangle' && this.realm.ninja === this) {
                    this.hp = Math.min(this.maxHp, this.hp + 15 * (dt/1000)); speedMult = 1.3; coolMult = 0.5;
                }
                if (this.heroType === 'square' && this.ultActiveTimer > 0) coolMult = 0.5;

                let currentBaseSpeed = (this.baseSpeed + (this.buffStacks * 0.08)) * speedMult;
                this.attackCooldown = Math.max(100, (this.baseCooldown - (this.buffStacks * 10))) * coolMult;
                if (this.slowTimer > 0) { this.slowTimer -= dt; this.speed = currentBaseSpeed * 0.5; } else { this.speed = currentBaseSpeed; }

                if (!this.isBot && this.hp > 0 && this.ultGauge < 100) {
                    this.ultGauge = Math.min(100, this.ultGauge + (2.5 * dt / 1000));
                    if (Math.floor(this.ultGauge) !== Math.floor(this.ultGauge - (2.5 * dt / 1000))) updateUI();
                }

                if (this.vx !== 0 || this.vy !== 0) this.facingAngle = Math.atan2(this.vy, this.vx);

                if (this.isBot && this.hp > 0 && !this.isDeadProcessed) {
                    let target = player; 
                    if (this.realm) target = (this.realm.ninja === this) ? this.realm.target : this.realm.ninja;

                    if (target && target.hp > 0 && target.realm === this.realm) {
                        let dx = target.x - this.x; let dy = target.y - this.y; let dist = Math.sqrt(dx*dx + dy*dy);
                        let attackRange = (this.heroType === 'square' || this.heroType === 'hexagon') ? 60 : ((this.heroType === 'triangle') ? 250 : 600);
                        
                        if (dist > attackRange * 0.8 && dist < 1200) { this.vx = dx / dist; this.vy = dy / dist; } 
                        else if (dist >= 1200) { let cx = MAP_WIDTH/2 - this.x; let cy = MAP_HEIGHT/2 - this.y; let cd = Math.hypot(cx, cy); if(cd > 0) { this.vx = cx/cd; this.vy = cy/cd; } } 
                        else { this.vx = 0; this.vy = 0; }
                        
                        if (dist <= attackRange && Math.random() < 0.05) this.fireProjectile(target.x, target.y);
                    } else { this.vx = 0; this.vy = 0; }
                }

                let nextX = this.x + this.vx * this.speed; let nextY = this.y + this.vy * this.speed;
                
                if (this.realm) {
                    let distToRealm = Math.hypot(nextX - this.realm.x, nextY - this.realm.y);
                    if (distToRealm > this.realm.radius - this.radius) {
                        let angleFromRealm = Math.atan2(nextY - this.realm.y, nextX - this.realm.x);
                        nextX = this.realm.x + Math.cos(angleFromRealm) * (this.realm.radius - this.radius);
                        nextY = this.realm.y + Math.sin(angleFromRealm) * (this.realm.radius - this.radius);
                    }
                } else {
                    nextX = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, nextX)); nextY = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, nextY));
                }

                if (this.heroType !== 'triangle') {
                    containers.forEach(rect => {
                        let testX = nextX; let testY = nextY;
                        if (nextX < rect.x) testX = rect.x; else if (nextX > rect.x + rect.w) testX = rect.x + rect.w;
                        if (nextY < rect.y) testY = rect.y; else if (nextY > rect.y + rect.h) testY = rect.y + rect.h;
                        let dist = Math.sqrt((nextX - testX)**2 + (nextY - testY)**2);
                        if (dist <= this.radius && dist > 0) {
                            let overlap = this.radius - dist;
                            nextX += ((nextX - testX) / dist) * overlap; nextY += ((nextY - testY) / dist) * overlap;
                        }
                    });
                }
                this.x = nextX; this.y = nextY;
            }

            drawShape(ctx) {
                let r = this.radius; ctx.beginPath();
                if (this.shape === 'circle') { ctx.arc(0, 0, r, 0, Math.PI * 2); } 
                else if (this.shape === 'square') { ctx.rect(-r*0.9, -r*0.9, r*1.8, r*1.8); } 
                else if (this.shape === 'triangle') { ctx.moveTo(r, 0); ctx.lineTo(-r*0.8, r*0.8); ctx.lineTo(-r*0.8, -r*0.8); ctx.closePath(); } 
                else if (this.shape === 'hexagon') { for (let i = 0; i < 6; i++) { ctx.lineTo(r * Math.cos(i * Math.PI / 3), r * Math.sin(i * Math.PI / 3)); } ctx.closePath(); }
                ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
            }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);

                if (this.buffStacks > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 6 + (this.buffStacks * 2), 0, Math.PI*2); 
                    ctx.strokeStyle = `rgba(52, 211, 153, ${0.4 + this.buffStacks * 0.1})`; ctx.lineWidth = 4; ctx.stroke();
                }
                if (this.invincibleTimer > 0) {
                    ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now()/100))*0.5; 
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 8, 0, Math.PI*2); ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
                if (this.slowTimer > 0) { ctx.beginPath(); ctx.arc(0, 0, this.radius + 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(147, 51, 234, 0.4)'; ctx.fill(); }

                if (this.heroType === 'square' && this.ultActiveTimer > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, 150, 0, Math.PI*2); ctx.fillStyle = 'rgba(74, 222, 128, 0.2)'; ctx.fill();
                    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]); ctx.stroke(); ctx.setLineDash([]);
                }
                if (this.heroType === 'hexagon' && this.ultActiveTimer > 0) { ctx.rotate((Date.now() % 1000) / 1000 * Math.PI * 2); } 
                else if (this.shape === 'triangle' || this.shape === 'square') { ctx.rotate(this.facingAngle); }

                this.drawShape(ctx);

                if (this.heroType === 'square' && (Date.now() - this.lastAttackTime < 150)) {
                    let punchExt = Math.sin((Date.now() - this.lastAttackTime)/150 * Math.PI) * 40;
                    ctx.fillStyle = '#fca5a5'; ctx.beginPath(); ctx.arc(punchExt, -20, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(punchExt*0.5, 20, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                }

                ctx.restore();

                ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Jua'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.name, this.x, this.y);

                ctx.fillStyle = '#1f2937'; ctx.fillRect(this.x - 25, this.y - 40, 50, 8);
                ctx.fillStyle = '#48bb78'; ctx.fillRect(this.x - 25, this.y - 40, 50 * (this.hp / this.maxHp), 8);
            }

            fireProjectile(twX, twY) {
                const now = Date.now(); if (now - this.lastAttackTime < this.attackCooldown) return;
                this.lastAttackTime = now; const angle = Math.atan2(twY - this.y, twX - this.x); this.facingAngle = angle;

                if (this.heroType === 'circle') { projectiles.push(new Projectile(this.x, this.y, angle, this.color, this)); } 
                else if (this.heroType === 'square') { meleeSlashes.push(new MeleeSlash(this.x, this.y, angle, 90, Math.PI/1.5, this.color, this)); } 
                else if (this.heroType === 'hexagon') { meleeSlashes.push(new MeleeSlash(this.x, this.y, angle, 120, Math.PI/1.5, this.color, this)); } 
                else if (this.heroType === 'triangle') {
                    projectiles.push(new Projectile(this.x, this.y, angle, this.color, this));
                    projectiles.push(new Projectile(this.x, this.y, angle - 0.25, this.color, this));
                    projectiles.push(new Projectile(this.x, this.y, angle + 0.25, this.color, this));
                }
            }
        }

        function initMap() {
            containers = []; const colors = ['#b91c1c', '#0369a1', '#15803d', '#ea580c']; 
            if (selectedGameMode === 'deathmatch') containers.push(new Container(1400, 1000, 400, 400, colors[1]));

            containers.push(new Container(1400, 200, 400, 150, colors[0])); containers.push(new Container(1400, 2050, 400, 150, colors[1]));
            containers.push(new Container(1000, 1300, 150, 200, colors[3])); containers.push(new Container(2050, 900, 150, 200, colors[2]));
            containers.push(new Container(800, 400, 200, 150, colors[0])); containers.push(new Container(2200, 400, 200, 150, colors[3]));
            containers.push(new Container(800, 1850, 200, 150, colors[2])); containers.push(new Container(2200, 1850, 200, 150, colors[0]));
            containers.push(new Container(400, 400, 100, 500, colors[2])); containers.push(new Container(400, 1500, 100, 500, colors[2])); 
            containers.push(new Container(2700, 400, 100, 500, colors[3])); containers.push(new Container(2700, 1500, 100, 500, colors[3])); 
            respawnZones = [ new RespawnZone(50, 800, 250, 800, 'blue'), new RespawnZone(MAP_WIDTH - 300, 800, 250, 800, 'red') ];
        }

        let isControlsSetup = false;
        function setupControls() {
            if (isControlsSetup) return; 
            isControlsSetup = true;

            window.addEventListener('keydown', (e) => { 
                keys[e.code] = true; 
                if(e.code === 'KeyR') activateUlt();
                if(e.code === 'KeyF') activateFlash();
            });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });
            canvas.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); if (aimingItem) cancelAim(); });

            canvas.addEventListener('pointerdown', (e) => {
                if (player.hp <= 0 || player.isDeadProcessed || !isGameActive) return;
                let twX = e.clientX + camera.x; let twY = e.clientY + camera.y;

                if (aimingItem) {
                    if (aimingItem === 'ult_ninja') {
                        let target = null; let minDist = 400;
                        for(let b of others) { if(b && b.hp > 0 && Math.hypot(b.x - twX, b.y - twY) < minDist) { target = b; minDist = Math.hypot(b.x - twX, b.y - twY); } }
                        if(target) { 
                            activeRealms.push(new Realm(player, target)); player.ultGauge = 0; aimingItem = null; showAnnouncement("차원의 결계 전개!"); updateUI(); 
                            if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/skills`).push({ uid: myUid, type: 'ult_ninja', targetName: target.name });
                        }
                        return;
                    }
                    else if (aimingItem === 'ult_hexagon') {
                        if (Math.hypot(twX - player.x, twY - player.y) <= 600) { 
                            player.x = twX; player.y = twY; player.ultActiveTimer = 3000; player.ultGauge = 0; aimingItem = null; showAnnouncement("회전 베기!"); updateUI(); 
                            if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/skills`).push({ uid: myUid, type: 'ult_hexagon', twX, twY });
                        }
                        return;
                    }

                    let angle = Math.atan2(twY - player.y, twX - player.x); let dist = Math.min(Math.hypot(twX - player.x, twY - player.y), aimingItem === 'grenade' ? 600 : 150); 
                    let finalX = player.x + Math.cos(angle) * dist; let finalY = player.y + Math.sin(angle) * dist;

                    // 🚨 핵심 교정 3-2: 내가 던진 수류탄과 지뢰를 다른 플레이어도 똑같이 볼 수 있도록 서버에 전송
                    if (aimingItem === 'grenade') { 
                        player.inventory.grenade--; explosives.push(new Explosive('grenade', player.x, player.y, player, finalX, finalY)); 
                        if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/skills`).push({ uid: myUid, type: 'grenade', finalX, finalY });
                    } 
                    else if (aimingItem === 'mine') { 
                        player.inventory.mine--; explosives.push(new Explosive('mine', finalX, finalY, player)); 
                        if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/skills`).push({ uid: myUid, type: 'mine', finalX, finalY });
                    }
                    aimingItem = null; updateUI(); return; 
                }

                let hitCrate = null;
                for(let c of supplyCrates) { if(c.active && c.dropZ <= 0 && Math.hypot(c.x - twX, c.y - twY) < c.radius * 2) { hitCrate = c; break; } }
                if(hitCrate && Math.hypot(player.x - hitCrate.x, player.y - hitCrate.y) < 150) {
                    if(hitCrate.failedTeams.includes(player.team)) showModal("이미 실패한 보급품입니다."); else openQuiz(hitCrate); return; 
                }

                let searchedContainer = null;
                for(let c of containers) {
                    if (!c.searched && twX > c.x - 40 && twX < c.x + c.w + 40 && twY > c.y - 40 && twY < c.y + c.h + 40) {
                        let cx = Math.max(c.x, Math.min(player.x, c.x + c.w)); let cy = Math.max(c.y, Math.min(player.y, c.y + c.h));
                        if (Math.hypot(player.x - cx, player.y - cy) < 100) { searchedContainer = c; break; }
                    }
                }
                if (searchedContainer) {
                    if (searchedContainer.failedTeams.includes(player.team)) showModal("수색 실패한 컨테이너입니다."); else openQuiz(searchedContainer); return; 
                }

                if(document.getElementById('quiz-modal-container').style.display !== 'flex' && (player.ultActiveTimer <= 0 || player.heroType === 'square')) {
                    player.fireProjectile(twX, twY);
                    if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/attacks`).push({ uid: myUid, twX: twX, twY: twY });
                }
            });

            const zone = document.getElementById('joystick-zone'); if (joystickManager) joystickManager.destroy();
            joystickManager = nipplejs.create({ zone: zone, mode: 'static', position: { left: '50%', top: '50%' }, color: 'white', size: 120 });
            joystickManager.on('move', (evt, data) => { if (data && data.vector && player.hp > 0 && !player.isDeadProcessed && isGameActive) { isJoystickActive = true; player.vx = data.vector.x; player.vy = -data.vector.y; } });
            joystickManager.on('end', () => { isJoystickActive = false; if(player) {player.vx = 0; player.vy = 0;} });
        }

        function toggleAim(type) { if (player.hp <= 0 || !isGameActive) return; if ((type === 'mine' || type === 'grenade') && player.inventory[type] <= 0) return; aimingItem = aimingItem === type ? null : type; updateUI(); }
        function cancelAim() { aimingItem = null; updateUI(); }
        
        function activateUlt() {
            if (player && player.hp > 0 && !player.isDeadProcessed && player.ultGauge >= 100 && isGameActive) {
                if (player.heroType === 'circle' || player.heroType === 'square') {
                    player.ultGauge = 0; player.ultActiveTimer = player.heroType === 'square' ? 5000 : 3000;
                    showAnnouncement(player.heroType === 'circle' ? "💦 물줄기 난사!" : "🔥 광폭화 및 치유 오라!"); updateUI();
                    // 🚨 핵심 교정 3-3: 물줄기와 치유 오라를 모두에게 동기화
                    if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/skills`).push({ uid: myUid, type: 'ult_activate' });
                } 
                else if (player.heroType === 'triangle') toggleAim('ult_ninja');
                else if (player.heroType === 'hexagon') toggleAim('ult_hexagon');
            }
        }

        function activateFlash() {
            if (player && player.hp > 0 && !player.isDeadProcessed && player.flashCooldown <= 0 && isGameActive) {
                let angle = player.facingAngle;
                if(player.vx === 0 && player.vy === 0) angle = Math.atan2(mouseY + camera.y - player.y, mouseX + camera.x - player.x);
                player.x += Math.cos(angle) * 300; player.y += Math.sin(angle) * 300;
                player.x = Math.max(player.radius, Math.min(MAP_WIDTH - player.radius, player.x)); player.y = Math.max(player.radius, Math.min(MAP_HEIGHT - player.radius, player.y));
                player.flashCooldown = 30000; showAnnouncement("⚡ 점멸!"); updateUI();
                // 🚨 핵심 교정 3-4: 점멸 사용을 모두에게 동기화
                if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/skills`).push({ uid: myUid, type: 'flash', x: player.x, y: player.y });
            }
        }

        function showAnnouncement(msg) { const el = document.getElementById('announcement'); el.innerText = msg; el.style.display = 'block'; setTimeout(() => { el.style.display = 'none'; }, 3500); }
        
        function triggerAirdrop() { 
            if (isSinglePlayer) {
                supplyCrates.push(new SupplyCrate(Math.random() * (MAP_WIDTH - 600) + 300, Math.random() * (MAP_HEIGHT - 600) + 300)); 
                showAnnouncement("📦 보급이 투하됩니다!"); 
            } else if (isHost) {
                db.ref(`rooms/${currentRoomId}/events/supplyCrates`).push({ x: Math.random() * (MAP_WIDTH - 600) + 300, y: Math.random() * (MAP_HEIGHT - 600) + 300, id: 'crate_' + Date.now() });
            }
        }

        function openQuiz(source) {
            activeQuizSource = source; document.querySelector('#quiz-box h2').innerText = source.quiz.type === 'crate' ? '📦 보급품 해제 중...' : '🔍 컨테이너 수색 중...';
            document.getElementById('quiz-question').innerText = source.quiz.question;
            const container = document.getElementById('quiz-options-container'); container.innerHTML = '';
            source.quiz.options.forEach(opt => {
                let btn = document.createElement('button'); btn.className = 'quiz-option w-full'; btn.innerText = opt;
                btn.onclick = () => submitAnswer(opt); container.appendChild(btn);
            });
            document.getElementById('quiz-modal-container').style.display = 'flex';
        }
        function closeQuiz() { document.getElementById('quiz-modal-container').style.display = 'none'; activeQuizSource = null; }
        
        function submitAnswer(selected) {
            if(!activeQuizSource) return;
            if(selected === activeQuizSource.quiz.answer) {
                if (activeQuizSource.quiz.type === 'crate') {
                    activeQuizSource.active = false;
                    if(Math.random() < 0.5) { player.inventory.mine++; showModal("정답! 지뢰 획득!"); } else { player.inventory.grenade++; showModal("정답! 수류탄 획득!"); }
                } else {
                    activeQuizSource.searched = true; showModal("수색 성공! 하트팩 발견!");
                    let cx = activeQuizSource.x + activeQuizSource.w / 2; let cy = activeQuizSource.y + activeQuizSource.h / 2;
                    let angle = Math.atan2(player.y - cy, player.x - cx);
                    heartPacks.push(new HeartPack(Math.max(30, Math.min(MAP_WIDTH - 30, player.x + Math.cos(angle)*50)), Math.max(30, Math.min(MAP_HEIGHT - 30, player.y + Math.sin(angle)*50))));
                }
                updateUI();
            } else {
                activeQuizSource.failedTeams.push(player.team); activeQuizSource.generateQuiz(); showModal("오답 실패!");
            }
            closeQuiz();
        }

        function startNewMission() {
            let idx = Math.floor(Math.random() * missions.length);
            let currentMissionTemp = missions[idx]; let correctAnswers = [];
            if (currentMissionTemp.type === 'divisor') { for(let i=1; i<=currentMissionTemp.target; i++) { if(currentMissionTemp.target % i === 0) correctAnswers.push(i); } } 
            else { for(let i=1; i<=6; i++) correctAnswers.push(currentMissionTemp.target * i); }

            let newOrbs = [];
            for (let i = 0; i < 20; i++) { 
                let x, y, valid = false, attempts = 0;
                while (!valid && attempts < 50) {
                    x = Math.random() * (MAP_WIDTH - 200) + 100; y = Math.random() * (MAP_HEIGHT - 200) + 100; valid = true;
                    for (let c of containers) { if (x > c.x - 20 && x < c.x + c.w + 20 && y > c.y - 20 && y < c.y + c.h + 20) { valid = false; break; } }
                    attempts++;
                }
                if (valid) newOrbs.push({ x: x, y: y, number: (i < 6) ? correctAnswers[Math.floor(Math.random() * correctAnswers.length)] : Math.floor(Math.random() * 30) + 1, id: 'orb_' + i + '_' + Date.now() }); 
            }

            if (isSinglePlayer) {
                currentMission = missions[idx]; missionBanner.innerText = currentMission.text;
                missionBanner.classList.add('mission-pop'); setTimeout(() => missionBanner.classList.remove('mission-pop'), 300);
                orbs = newOrbs.map(o => new ResourceOrb(o.x, o.y, o.number, o.id));
            } else if (isHost) {
                db.ref(`rooms/${currentRoomId}/events/mission`).set({ index: idx, orbs: newOrbs });
            }
        }

        function checkGameEnd() {
            if(selectedGameMode === 'deathmatch') {
                if(stats.blue.kills >= 100) endGame("블루팀 승리! (100킬 달성)");
                else if(stats.red.kills >= 100) endGame("레드팀 승리! (100킬 달성)");
            }
        }
        
        function endGame(msg) {
            currentState = GAME_STATE.GAME_OVER; const modal = document.getElementById('modal');
            modal.innerText = msg; modal.style.display = 'block';
            if (animationFrameId) cancelAnimationFrame(animationFrameId); 
            setTimeout(() => { modal.style.display = 'none'; document.getElementById('game-container').style.display = 'none'; document.getElementById('start-screen').style.display = 'flex'; leaveRoom(); }, 5000);
        }

        function handleDeath(deadPlayer, killer) {
            if (isSinglePlayer) {
                displayKillLog(killer ? killer.name : '시스템', killer ? killer.team : '', deadPlayer.name, deadPlayer.team);
                if (deadPlayer.team === 'blue') { stats.blue.deaths++; stats.red.kills++; if(deadPlayer===player) { showModal("사망! 3초 후 리스폰됩니다."); closeQuiz(); } } 
                else { stats.red.deaths++; stats.blue.kills++; if(killer===player) showModal("적을 처치했습니다!"); }
                
                document.getElementById('score-blue-kill').innerText = stats.blue.kills; document.getElementById('score-blue-death').innerText = stats.blue.deaths;
                document.getElementById('score-red-kill').innerText = stats.red.kills; document.getElementById('score-red-death').innerText = stats.red.deaths;
                
                if(deadPlayer.realm) { deadPlayer.realm.active = false; deadPlayer.realm = null; }
                deadPlayer.hp = 0; deadPlayer.x = -1000; deadPlayer.targetX = -1000; deadPlayer.isDeadProcessed = true;
                setTimeout(() => { deadPlayer.spawn(); updateUI(); }, 3000); updateUI();
                checkGameEnd();
            } else {
                if (deadPlayer === player || (isHost && deadPlayer.isBot)) {
                    db.ref(`rooms/${currentRoomId}/events/killLogs`).push({
                        killerName: killer ? killer.name : '알 수 없음', killerTeam: killer ? killer.team : '',
                        victimName: deadPlayer.name, victimTeam: deadPlayer.team,
                        victimUid: deadPlayer === player ? myUid : deadPlayer.name
                    });
                }
                deadPlayer.hp = 0; deadPlayer.isDeadProcessed = true; 
            }
        }

        function checkCollisions() {
            if (player.hp > 0 && !player.isDeadProcessed) {
                for (let i = orbs.length - 1; i >= 0; i--) {
                    let orb = orbs[i];
                    if (Math.hypot(player.x - orb.x, player.y - orb.y) < player.radius + orb.radius) {
                        let isAns = currentMission.type === 'divisor' ? (currentMission.target % orb.number === 0) : (orb.number % currentMission.target === 0);
                        if (isAns) player.buffStacks = Math.min(5, player.buffStacks + 1); else player.slowTimer = 3000; 
                        
                        orbs.splice(i, 1); updateUI(); 
                        if (!isSinglePlayer) db.ref(`rooms/${currentRoomId}/events/orbEaten`).push(orb.id);
                        
                        if (isSinglePlayer || isHost) { if (!orbs.some(o => currentMission.type === 'divisor' ? (currentMission.target % o.number === 0) : (o.number % currentMission.target === 0)) || orbs.length === 0) startNewMission(); }
                    }
                }
                for (let i = heartPacks.length - 1; i >= 0; i--) {
                    let hp = heartPacks[i];
                    if (Math.hypot(player.x - hp.x, player.y - hp.y) < player.radius + hp.radius) { player.hp = Math.min(player.maxHp, player.hp + 50); heartPacks.splice(i, 1); showModal("하트팩 획득! 체력 +50"); updateUI(); }
                }
            }
            
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i]; if (!p.active) continue;
                for (let t of [player, ...others]) {
                    if (t && t.hp > 0 && t.invincibleTimer <= 0 && !t.isDeadProcessed && p.owner.team !== t.team && p.owner.realm === t.realm) {
                        if (Math.hypot(t.x - p.x, t.y - p.y) < t.radius + p.radius) { 
                            let dmg = p.damage; if(t.heroType === 'hexagon' && t.ultActiveTimer > 0) dmg *= 0.8;
                            t.hp -= dmg; p.active = false; 
                            if (!p.owner.isBot && !p.owner.isRemote) { p.owner.ultGauge = Math.min(100, p.owner.ultGauge + 5); updateUI(); }
                            if(t.hp <= 0 && !t.isDeadProcessed) { t.isDeadProcessed = true; handleDeath(t, p.owner); }
                        }
                    }
                }
            }
        }

        function updateDominationUI() {
            document.getElementById('dom-blue').innerText = Math.floor(domScores.blue); document.getElementById('dom-red').innerText = Math.floor(domScores.red);
            let m = Math.floor(gameTimeRemaining / 60); let s = Math.floor(gameTimeRemaining % 60); document.getElementById('game-time').innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateUI() {
            if (player) {
                uiHp.style.width = player.hp > 0 ? `${(player.hp / player.maxHp) * 100}%` : `0%`; uiUlt.style.width = `${player.ultGauge}%`;
                document.getElementById('badge-mine').innerText = player.inventory.mine; document.getElementById('badge-grenade').innerText = player.inventory.grenade;
                document.getElementById('ui-buff').innerText = `강화: ${player.buffStacks}단계`;
                
                const btnMine = document.getElementById('btn-mine'); const btnGrenade = document.getElementById('btn-grenade');
                btnMine.style.boxShadow = aimingItem === 'mine' ? '0 0 20px #d8b4fe, inset 0 0 10px #d8b4fe' : '0 4px 6px rgba(0,0,0,0.5)';
                btnGrenade.style.boxShadow = aimingItem === 'grenade' ? '0 0 20px #fca5a5, inset 0 0 10px #fca5a5' : '0 4px 6px rgba(0,0,0,0.5)';
                
                const btnUlt = document.getElementById('btn-ult');
                if (player.ultGauge >= 100) btnUlt.classList.add('ult-ready'); else btnUlt.classList.remove('ult-ready');

                const flashEl = document.getElementById('flash-cd-text');
                if(player.flashCooldown > 0) flashEl.innerText = Math.ceil(player.flashCooldown/1000) + 's'; else flashEl.innerText = '';
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#374151'; ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT); ctx.strokeStyle = 'rgba(250, 204, 21, 0.15)'; ctx.lineWidth = 4;
            for (let x = 0; x < MAP_WIDTH; x += 200) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke(); }
            for (let y = 0; y < MAP_HEIGHT; y += 200) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke(); }
        }

        function gameLoop(timestamp) {
            if (currentState !== GAME_STATE.PLAYING) return;
            
            let dt = timestamp - lastTime; 
            lastTime = timestamp;
            if (dt > 100) dt = 100; 

            if (!isSinglePlayer && isGameActive) {
                syncTimer -= dt;
                if (syncTimer <= 0) {
                    syncTimer = 100;
                    if (player && currentRoomId) {
                        db.ref(`rooms/${currentRoomId}/players/${myUid}`).update({ 
                            x: player.isDeadProcessed ? -1000 : Math.round(player.x), 
                            y: player.isDeadProcessed ? -1000 : Math.round(player.y), 
                            facingAngle: parseFloat(player.facingAngle.toFixed(2)), 
                            hp: Math.round(player.hp),
                            ult: Math.max(0, Math.round(player.ultActiveTimer)),
                            buff: player.buffStacks,
                            inv: Math.max(0, Math.round(player.invincibleTimer))
                        });
                    }
                }
            }

            if(selectedGameMode === 'domination' && isGameActive) {
                gameTimeRemaining -= dt/1000;
                if(gameTimeRemaining <= 0) {
                    if(domScores.blue > domScores.red) endGame("블루팀 승리! (점령전)"); else if(domScores.red > domScores.blue) endGame("레드팀 승리! (점령전)"); else endGame("무승부!");
                    return;
                }
                domPoint.update(dt); updateDominationUI();
            }

            if((isSinglePlayer || isHost) && isGameActive) { airdropTimer -= dt; if (airdropTimer <= 0) { triggerAirdrop(); airdropTimer = 25000; } }

            if (player.hp > 0 && !player.isDeadProcessed && !isJoystickActive && isGameActive && document.getElementById('quiz-modal-container').style.display !== 'flex') {
                let dx = 0, dy = 0;
                if (keys['KeyW'] || keys['ArrowUp']) dy -= 1; if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1; if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
                if (dx !== 0 || dy !== 0) { const length = Math.sqrt(dx*dx + dy*dy); player.vx = dx / length; player.vy = dy / length; } else { player.vx = 0; player.vy = 0; }
                
                if (keys['Space'] && (player.ultActiveTimer <= 0 || player.heroType === 'square')) {
                    let twX = mouseX + camera.x; let twY = mouseY + camera.y;
                    player.fireProjectile(twX, twY);
                    if (!isSinglePlayer && currentRoomId) db.ref(`rooms/${currentRoomId}/events/attacks`).push({ uid: myUid, twX: twX, twY: twY });
                }
            }

            if (player.hp > 0 && isGameActive) player.update(dt); 
            if (isGameActive) others.forEach(b => { if(b && b.hp > 0) b.update(dt); });
            
            supplyCrates.forEach(c => c.update(dt)); 
            projectiles.forEach(p => p.update()); projectiles = projectiles.filter(p => p.active);
            meleeSlashes.forEach(m => m.update(dt)); meleeSlashes = meleeSlashes.filter(m => m.active);
            explosives.forEach(e => e.update(dt)); explosives = explosives.filter(e => e.active);
            activeRealms.forEach(r => r.update(dt)); activeRealms = activeRealms.filter(r => r.active);
            
            if(player.flashCooldown > 0) updateUI(); 
            if(isGameActive) checkCollisions();

            if (player.hp > 0 && !player.isDeadProcessed) {
                camera.x = player.x - viewWidth / 2; camera.y = player.y - viewHeight / 2;
                camera.x = Math.max(0, Math.min(MAP_WIDTH - viewWidth, camera.x)); camera.y = Math.max(0, Math.min(MAP_HEIGHT - viewHeight, camera.y));
            }

            ctx.clearRect(0, 0, viewWidth, viewHeight); ctx.save(); ctx.translate(-camera.x, -camera.y);

            drawBackground();
            domPoint.draw(ctx);
            activeRealms.forEach(r => r.draw(ctx));
            respawnZones.forEach(z => z.draw(ctx));
            containers.forEach(c => c.draw(ctx));
            heartPacks.forEach(h => h.draw(ctx));
            supplyCrates.forEach(c => c.draw(ctx));
            explosives.forEach(e => { if(e.type === 'mine') e.draw(ctx); }); 
            orbs.forEach(o => o.draw(ctx));
            
            if (aimingItem && player.hp > 0 && !player.isDeadProcessed) {
                let range = (aimingItem === 'grenade' || aimingItem === 'ult_hexagon') ? 600 : (aimingItem === 'ult_ninja' ? 400 : 150); 
                let color = aimingItem.includes('ult') ? '#fbbf24' : (aimingItem === 'grenade' ? '#fca5a5' : '#d8b4fe'); 
                ctx.beginPath(); ctx.arc(player.x, player.y, range, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill(); ctx.strokeStyle = color; ctx.setLineDash([10, 10]); ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
                let mWorldX = mouseX + camera.x; let mWorldY = mouseY + camera.y; let angle = Math.atan2(mWorldY - player.y, mWorldX - player.x); let dist = Math.min(range, Math.hypot(mWorldX - player.x, mWorldY - player.y));
                let targetX = player.x + Math.cos(angle) * dist; let targetY = player.y + Math.sin(angle) * dist;
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(targetX, targetY); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(targetX - 10, targetY - 10); ctx.lineTo(targetX + 10, targetY + 10); ctx.moveTo(targetX + 10, targetY - 10); ctx.lineTo(targetX - 10, targetY + 10); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke();
            }

            others.forEach(b => { if(b && b.hp > 0 && !b.isDeadProcessed) b.draw(ctx); });
            if (player.hp > 0 && !player.isDeadProcessed) player.draw(ctx);
            
            meleeSlashes.forEach(m => m.draw(ctx));
            projectiles.forEach(p => p.draw(ctx)); 
            explosives.forEach(e => { if(e.type !== 'mine') e.draw(ctx); }); 

            ctx.restore(); 
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
