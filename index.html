<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Arena 3v3 - 로비 및 멀티플레이</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- NippleJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #374151; font-family: 'Jua', sans-serif; touch-action: none; user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: none; }
        canvas { display: block; width: 100%; height: 100%; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 20px; z-index: 10; }
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        
        #scoreboard { background: rgba(0, 0, 0, 0.75); padding: 10px 20px; border-radius: 12px; border: 2px solid #4b5563; color: white; font-size: 20px; display: flex; gap: 20px; pointer-events: auto; }
        .score-team { display: flex; flex-direction: column; align-items: center; }
        .score-blue { color: #60a5fa; }
        .score-red { color: #f87171; }
        .score-numbers { font-size: 24px; font-weight: bold; }

        /* 킬로그 */
        #kill-log-container { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 100; align-items: flex-end; }
        .kill-log-item { background: rgba(0,0,0,0.75); color: white; padding: 6px 16px; border-radius: 8px; font-size: 16px; border: 1px solid rgba(255,255,255,0.3); animation: fadeOut 4.5s forwards; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        @keyframes fadeOut { 0% { opacity: 1; transform: translateX(20px); } 10% { transform: translateX(0); } 80% { opacity: 1; } 100% { opacity: 0; display: none; } }

        /* 점령전 UI */
        #domination-ui { background: rgba(0, 0, 0, 0.8); padding: 10px 20px; border-radius: 12px; border: 2px solid #fbbf24; color: white; display: none; flex-direction: column; align-items: center; pointer-events: auto;}
        .dom-time { font-size: 20px; margin-top: 5px; }

        #mission-banner { background: rgba(0, 0, 0, 0.8); color: #fbbf24; padding: 10px 30px; border-radius: 9999px; font-size: 24px; text-align: center; border: 2px solid #fbbf24; transition: transform 0.3s ease; pointer-events: auto; margin: 0 10px;}
        .mission-pop { transform: scale(1.1); }

        #player-stats { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border-radius: 12px; color: white; display: flex; gap: 20px; align-items: center; pointer-events: auto;}
        .bar-group { display: flex; flex-direction: column; position: relative; }
        .hp-bar-container, .ult-bar-container { width: 150px; height: 15px; background: #4a5568; border-radius: 8px; overflow: hidden; margin-bottom: 5px; }
        .hp-bar-fill { height: 100%; background: #48bb78; width: 100%; transition: width 0.2s; }
        .ult-bar-fill { height: 100%; background: #ed8936; width: 0%; transition: width 0.2s; }

        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; pointer-events: auto; }
        #skill-zone { position: absolute; bottom: 20px; right: 20px; pointer-events: auto; display: flex; gap: 15px; align-items: flex-end; }
        
        .skill-btn { background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 16px; width: 65px; height: 65px; position: relative; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
        .skill-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
        .item-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; display: flex; justify-content: center; align-items: center; border: 2px solid white; font-weight: bold;}
        
        #btn-grenade { border-color: #fca5a5; color: #fca5a5; }
        #btn-mine { border-color: #d8b4fe; color: #d8b4fe; }
        #btn-ult { border-color: #ed8936; color: #ed8936; font-size: 20px; font-weight: bold; width: 75px; height: 75px; }
        .ult-ready { background: rgba(237, 137, 54, 0.4) !important; animation: pulse 1.5s infinite; color: white !important; border-color: white !important;}
        #btn-flash { border-color: #38bdf8; color: #38bdf8; }
        
        .cooldown-overlay { position: absolute; bottom: -25px; font-size: 14px; font-weight: bold; color: #fbbf24; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(237, 137, 54, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(237, 137, 54, 0); } 100% { box-shadow: 0 0 0 0 rgba(237, 137, 54, 0); } }

        #quiz-modal-container { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 200; pointer-events: auto; justify-content: center; align-items: center; }
        #quiz-box { background: #1f2937; border: 4px solid #fbbf24; border-radius: 16px; padding: 30px; width: 90%; max-width: 500px; text-align: center; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        .quiz-option { background: #3b82f6; border: 2px solid #2563eb; color: white; padding: 15px; margin: 10px 0; border-radius: 8px; font-size: 20px; cursor: pointer; transition: background 0.2s; }
        .quiz-option:hover { background: #2563eb; }

        #countdown-overlay { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 250; color: #fbbf24; font-size: 120px; font-weight: bold; justify-content: center; align-items: center; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        .fullscreen-menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #0f172a, #1e3a8a); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300; }
        .hidden-menu { display: none !important; }
        
        .mode-selection { display: flex; gap: 30px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 15px 30px; border-radius: 12px;}
        .mode-option { color: white; font-size: 20px; display: flex; align-items: center; gap: 10px; cursor: pointer;}
        .mode-option input { transform: scale(1.5); }

        .hero-cards { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
        .hero-card { background: rgba(255,255,255,0.1); border: 4px solid transparent; border-radius: 16px; padding: 20px; width: 180px; text-align: center; cursor: pointer; transition: 0.2s; color: white; }
        .hero-card:hover { background: rgba(255,255,255,0.2); }
        .hero-card.selected { border-color: #fbbf24; background: rgba(251, 191, 36, 0.2); transform: scale(1.05); }
        .hero-icon { width: 60px; height: 60px; margin: 0 auto 10px auto; background: #3b82f6; }
        
        .shape-circle { border-radius: 50%; }
        .shape-square { border-radius: 10px; }
        .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 0; }
        .shape-hexagon { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); border-radius: 0; }

        .menu-btn { background: #3b82f6; color: white; padding: 15px 40px; font-size: 24px; border-radius: 12px; margin: 10px; cursor: pointer; border: 4px solid #2563eb; font-family: 'Jua', sans-serif; width: 300px; transition: 0.2s; }
        .menu-btn:hover { background: #2563eb; transform: scale(1.05); }
        .menu-btn:disabled { background: #6b7280; border-color: #4b5563; cursor: not-allowed; transform: none; }
        
        #modal { display: none; position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 20px 40px; border-radius: 10px; z-index: 600; text-align: center; font-size: 32px; border: 2px solid #fbbf24; pointer-events: none; white-space: nowrap; box-shadow: 0 10px 20px rgba(0,0,0,0.5);}
        #announcement { display: none; position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); background: rgba(220,38,38,0.9); color: white; padding: 15px 40px; border-radius: 8px; z-index: 150; text-align: center; font-size: 30px; border: 4px solid #fca5a5; pointer-events: none; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.5); animation: dropIn 0.5s ease-out;}
        
        .lobby-box { background: rgba(0,0,0,0.5); padding: 30px; border-radius: 16px; text-align: center; }
        .input-text { padding: 10px; font-size: 20px; border-radius: 8px; border: none; text-align: center; font-family: 'Jua'; width: 250px; margin-bottom: 10px; }
        
        .team-box { width: 300px; min-height: 200px; border-radius: 12px; padding: 15px; border: 4px solid transparent; }
        .team-blue { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        .team-red { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .player-item { background: rgba(0,0,0,0.6); padding: 10px; margin: 5px 0; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center;}
        .status-ready { color: #48bb78; font-weight: bold; }
        .status-wait { color: #a0aec0; }

        @media (max-width: 768px) {
            #skill-zone { transform: scale(0.8); transform-origin: bottom right; bottom: 10px; right: 10px; gap: 10px; }
            #joystick-zone { transform: scale(0.8); transform-origin: bottom left; bottom: 10px; left: 10px; }
            #player-stats { transform: scale(0.8) translateX(-50%); transform-origin: bottom left; left: 50%; bottom: 10px; }
            #scoreboard { font-size: 16px; padding: 5px 10px; gap: 10px; }
            .score-numbers { font-size: 20px; }
            #mission-banner { font-size: 18px; padding: 5px 15px; }
            .hero-card { width: 140px; padding: 10px; }
            .hero-icon { width: 50px; height: 50px; margin-bottom: 5px; }
            .menu-btn { font-size: 20px; padding: 10px 20px; width: 220px; }
            .team-box { width: 250px; min-height: 150px; }
            #countdown-overlay { font-size: 80px; }
        }
    </style>
</head>
<body>

    <div id="start-screen" class="fullscreen-menu">
        <h1 class="text-7xl text-yellow-400 mb-4 drop-shadow-2xl font-bold">MATH ARENA</h1>
        <p class="text-2xl text-gray-300 mb-12">수학과 생존의 결투</p>
        <button class="menu-btn mb-4" onclick="showMenu('single-player-menu')">싱글플레이</button>
        <button class="menu-btn !bg-purple-600 !border-purple-800 hover:!bg-purple-700" onclick="showMenu('multiplayer-lobby')">멀티플레이 (PvP)</button>
    </div>

    <div id="single-player-menu" class="fullscreen-menu hidden-menu">
        <button class="absolute top-5 left-5 bg-gray-700 text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-600 transition" onclick="showMenu('start-screen')">⬅ 뒤로가기</button>
        <h1 class="text-5xl text-yellow-400 mb-2 drop-shadow-lg mt-8">싱글플레이 설정</h1>
        <div class="mode-selection mt-4">
            <label class="mode-option"><input type="radio" name="spGameMode" value="domination" checked> 점령전 (5분)</label>
            <label class="mode-option"><input type="radio" name="spGameMode" value="deathmatch"> 100킬전</label>
        </div>
        <div class="hero-cards" id="sp-hero-cards"></div>
        <div class="mb-4 text-white text-xl">
            <label for="player-nickname-sp" class="mr-2">내 이름:</label>
            <input type="text" id="player-nickname-sp" maxlength="4" placeholder="최대 4자" class="text-black text-center w-24 p-1 rounded font-bold mr-4" value="용사">
            <label for="bot-count" class="mr-2">적(봇) 수:</label>
            <input type="number" id="bot-count" value="3" min="1" max="5" class="text-black text-center w-16 p-1 rounded font-bold">
        </div>
        <button class="menu-btn" onclick="startSinglePlayer()">레디 (게임 시작)</button>
    </div>

    <div id="multiplayer-lobby" class="fullscreen-menu hidden-menu">
        <button class="absolute top-5 left-5 bg-gray-700 text-white px-4 py-2 rounded-lg font-bold" onclick="showMenu('start-screen')">⬅ 메인으로</button>
        <h1 class="text-5xl text-yellow-400 mb-8 drop-shadow-lg">멀티플레이 로비</h1>
        <div class="lobby-box">
            <p class="text-xl text-white mb-2">닉네임 (최대 4자)</p>
            <input type="text" id="player-nickname-mp" class="input-text" maxlength="4" placeholder="이름을 입력하세요" value="용사">
            <div class="mt-8"><button class="menu-btn" onclick="createRoom()">새로운 방 만들기</button></div>
            <div class="mt-8 border-t border-gray-500 pt-6">
                <input type="text" id="join-room-id" class="input-text" placeholder="방 번호 입력"><br>
                <button class="menu-btn !bg-green-600 !border-green-800" onclick="joinRoomBtn()">방 참가하기</button>
            </div>
        </div>
    </div>

    <div id="multiplayer-room" class="fullscreen-menu hidden-menu">
        <button class="absolute top-5 left-5 bg-red-600 text-white px-4 py-2 rounded-lg font-bold" onclick="leaveRoom()">나가기</button>
        <h2 class="text-4xl text-white mb-4">방 번호: <span id="display-room-id" class="text-yellow-400 font-bold">0000</span></h2>
        
        <div class="mode-selection" id="mp-mode-selection">
            <label class="mode-option"><input type="radio" name="mpGameMode" value="domination" checked onchange="updateRoomMode()"> 점령전</label>
            <label class="mode-option"><input type="radio" name="mpGameMode" value="deathmatch" onchange="updateRoomMode()"> 100킬전</label>
        </div>

        <div class="flex gap-10 w-full max-w-4xl justify-center mb-4 flex-wrap">
            <div class="team-box team-blue">
                <h3 class="text-2xl text-blue-300 text-center mb-4 font-bold">블루팀</h3>
                <div id="mp-blue-list"></div>
                <button class="w-full mt-4 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-500" onclick="switchTeam('blue')">블루팀 참가</button>
            </div>
            <div class="team-box team-red">
                <h3 class="text-2xl text-red-300 text-center mb-4 font-bold">레드팀</h3>
                <div id="mp-red-list"></div>
                <button class="w-full mt-4 bg-red-600 text-white py-2 rounded font-bold hover:bg-red-500" onclick="switchTeam('red')">레드팀 참가</button>
            </div>
        </div>

        <div class="hero-cards" id="mp-hero-cards" style="margin: 10px 0; transform: scale(0.8);"></div>
        <div class="flex gap-4">
            <button class="menu-btn !bg-gray-600" id="btn-mp-ready" onclick="toggleReady()">준비하기</button>
            <button class="menu-btn" id="btn-mp-start" onclick="startMultiplayer()" disabled>게임 시작</button>
        </div>
        <p id="start-warning" class="text-red-400 mt-2 font-bold h-6"></p>
    </div>

    <div id="modal">메시지</div>
    <div id="announcement">📦 보급이 곧 투하됩니다!</div>
    <div id="countdown-overlay">3</div>
    <div id="kill-log-container"></div>

    <div id="quiz-modal-container">
        <div id="quiz-box">
            <h2 class="text-yellow-400 text-3xl mb-4">📦 보급품 해제 중...</h2>
            <p id="quiz-question" class="text-2xl mb-6">문제 텍스트</p>
            <div id="quiz-options-container"></div>
            <button class="mt-6 bg-red-500 px-6 py-2 rounded-lg text-white font-bold" onclick="closeQuiz()">포기하고 전투 복귀</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="top-bar">
                <div id="scoreboard">
                    <div class="score-team score-blue"><span>블루팀 K/D</span><span class="score-numbers"><span id="score-blue-kill">0</span> / <span id="score-blue-death">0</span></span></div>
                    <div class="text-gray-400 text-3xl font-bold mt-2">VS</div>
                    <div class="score-team score-red"><span>레드팀 K/D</span><span class="score-numbers"><span id="score-red-kill">0</span> / <span id="score-red-death">0</span></span></div>
                </div>
                
                <div id="mission-banner">로딩 중...</div>
                
                <div id="domination-ui">
                    <div class="text-xl font-bold text-yellow-300">⏳ 남은 시간: <span id="game-time">05:00</span></div>
                    <div class="flex gap-4 mt-2">
                        <div class="text-blue-400 dom-time">블루 점령: <span id="dom-blue">0</span>초</div>
                        <div class="text-red-400 dom-time">레드 점령: <span id="dom-red">0</span>초</div>
                    </div>
                </div>
            </div>
            
            <div id="joystick-zone"></div>
            
            <div id="player-stats">
                <div class="bar-group">
                    <div class="text-sm mb-1 text-green-400 font-bold">HP</div>
                    <div class="hp-bar-container"><div id="ui-hp" class="hp-bar-fill"></div></div>
                </div>
                <div class="bar-group">
                    <div class="text-sm mb-1 text-orange-400 font-bold">궁극기</div>
                    <div class="ult-bar-container"><div id="ui-ult" class="ult-bar-fill"></div></div>
                </div>
                <div class="bar-group justify-center ml-4">
                    <div class="text-sm text-yellow-400 font-bold" id="ui-buff">강화: 0단계</div>
                </div>
            </div>

            <div id="skill-zone">
                <div class="skill-btn" id="btn-mine" onpointerdown="toggleAim('mine'); event.stopPropagation();">지뢰<div id="badge-mine" class="item-badge">0</div></div>
                <div class="skill-btn" id="btn-grenade" onpointerdown="toggleAim('grenade'); event.stopPropagation();">수류탄<div id="badge-grenade" class="item-badge">0</div></div>
                <div class="skill-btn" id="btn-ult" onpointerdown="activateUlt(); event.stopPropagation();">궁</div>
                <div class="skill-btn" id="btn-flash" onpointerdown="activateFlash(); event.stopPropagation();">점멸<span id="flash-cd-text" class="cooldown-overlay"></span></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCOXhtzOVGW4NtILMKqpV98iWU8g8gpSao",
            authDomain: "matharena-a9fcd.firebaseapp.com",
            databaseURL: "https://matharena-a9fcd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "matharena-a9fcd",
            storageBucket: "matharena-a9fcd.firebasestorage.app",
            messagingSenderId: "286551796642",
            appId: "1:286551796642:web:59b8bf0202f53f62a860fb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiHp = document.getElementById('ui-hp');
        const uiUlt = document.getElementById('ui-ult');
        const missionBanner = document.getElementById('mission-banner');

        let viewWidth, viewHeight;
        function resize() { viewWidth = window.innerWidth; viewHeight = window.innerHeight; canvas.width = viewWidth; canvas.height = viewHeight; }
        window.addEventListener('resize', resize); resize();

        const GAME_STATE = { MENU: 0, PLAYING: 1, GAME_OVER: 2 };
        let currentState = GAME_STATE.MENU;
        let isGameActive = false; 
        
        let myUid = "uid_" + Math.random().toString(36).substr(2, 9);
        let currentRoomId = null;
        let isHost = false, isReady = false, myTeam = 'blue', isSinglePlayer = true;
        let animationFrameId = null; 

        const MAP_WIDTH = 3200;
        const MAP_HEIGHT = 2400;
        let camera = { x: 0, y: 0 };
        let selectedGameMode = 'domination';
        let stats = { blue: { kills: 0, deaths: 0 }, red: { kills: 0, deaths: 0 } };
        let gameTimeRemaining = 300; 
        let domScores = { blue: 0, red: 0 };

        let player;
        let others = []; 
        let remotePlayers = {}; 
        let syncTimer = 0; 

        let projectiles = [], meleeSlashes = [], orbs = [], containers = [];
        let respawnZones = [], supplyCrates = [], explosives = [], heartPacks = [], activeRealms = [];
        
        let currentMission = null, lastTime = 0, activeQuizSource = null, aimingItem = null, airdropTimer = 10000;
        let mouseX = 0, mouseY = 0, joystickManager = null, isJoystickActive = false;
        const keys = {};

        const HEROES = {
            circle: { name: '원형 슈터', shape: 'circle', baseSpeed: 5, maxHp: 100, cooldown: 350, desc: '원거리 사격, 3초 물줄기 연사' },
            square: { name: '네모 탱커', shape: 'square', baseSpeed: 4, maxHp: 150, cooldown: 600, desc: '주먹질(흡혈), 5초 광폭화 및 힐링오라' },
            triangle: { name: '세모 닌자', shape: 'triangle', baseSpeed: 5.5, maxHp: 90, cooldown: 800, desc: '표창, 5초간 적을 결계에 가둠' },
            hexagon: { name: '육각 검사', shape: 'hexagon', baseSpeed: 6.0, maxHp: 120, cooldown: 500, desc: '빠른 이속, 3초 순간이동 회전베기' }
        };
        let selectedHeroType = 'circle';
        
        const missions = [
            { type: 'divisor', target: 16, text: "16의 약수를 모두 모아라!" },
            { type: 'divisor', target: 24, text: "24의 약수를 모두 모아라!" },
            { type: 'multiple', target: 5, text: "5의 배수를 찾아라!" },
            { type: 'multiple', target: 7, text: "7의 배수를 찾아라!" }
        ];

            if(!roomId) return showModal("방 번호를 입력하세요!");

        function joinRoom(roomId, name) {
            currentRoomId = roomId; myTeam = 'blue'; isReady = false; isSinglePlayer = false;
            const playerRef = db.ref(`rooms/${roomId}/players/${myUid}`);
            playerRef.onDisconnect().remove();
            playerRef.set({ name: name, team: myTeam, hero: selectedHeroType, isReady: false });
            document.getElementById('display-room-id').innerText = roomId; showMenu('multiplayer-room');
            document.querySelectorAll('input[name="mpGameMode"]').forEach(el => el.disabled = !isHost);
            
            // 🚨 핵심 교정 1: 방 전체(이벤트, 수백개의 킬로그 포함)를 매번 다운로드하지 않도록 리스너를 노드별로 분리
            db.ref(`rooms/${roomId}/status`).on('value', snap => {
                const status = snap.val();
                if(!status) { leaveRoom(); return showModal("방이 사라졌습니다."); }
                if(status === 'playing' && currentState === GAME_STATE.MENU) {
                    db.ref(`rooms/${roomId}`).once('value').then(s => {
                        let data = s.val();
                        enterIngame(data.mode, data.players);
                    });
                }
            });

            db.ref(`rooms/${roomId}/mode`).on('value', snap => {
                if(currentState === GAME_STATE.MENU && snap.val()) {
                    document.querySelector(`input[name="mpGameMode"][value="${snap.val()}"]`).checked = true;
                }
            });

            // 플레이어들의 위치 및 상태만 가볍게 동기화
            db.ref(`rooms/${roomId}/players`).on('value', snap => {
                const playersData = snap.val();
                if(!playersData) return;
                
                if (currentState === GAME_STATE.MENU) {
                    updateRoomUI(playersData);
                } else if (currentState === GAME_STATE.PLAYING) {
                    for(let uid in playersData) {
                        if(uid === myUid) continue; 
                        let pData = playersData[uid]; let p = remotePlayers[uid];
                        
                        if(p) { 
                            // 🚨 핵심 교정 2: 죽었다가 DB에서 HP가 다시 찬 경우 무조건 강제 부활 (Snap)
                            let justRespawned = p.isDeadProcessed && (pData.hp > 0);
                            
                            if (pData.hp !== undefined) {
                                p.hp = pData.hp;
                                p.isDeadProcessed = (p.hp <= 0); 
                            }

                            if (!p.isDeadProcessed) {
                                if (pData.x !== undefined) p.targetX = pData.x;
                                if (pData.y !== undefined) p.targetY = pData.y;
                                if (pData.facingAngle !== undefined) p.facingAngle = pData.facingAngle;
                                
                                // 화면 밖에 있다가 부활했으므로 즉시 해당 위치로 강제이동 (안그러면 걸어오느라 안보임)
                                if (justRespawned) {
                                    p.x = p.targetX;
                                    p.y = p.targetY;
                                }
                            } else {
                                p.targetX = -1000;
                                p.x = -1000;
                            }

                            if (pData.ult !== undefined) p.ultActiveTimer = pData.ult;
                            if (pData.buff !== undefined) p.buffStacks = pData.buff;
                            if (pData.inv !== undefined) p.invincibleTimer = pData.inv;
                        }
                    }
                }
            });
        }

        function triggerNewMissionSync() {
            let idx = Math.floor(Math.random() * missions.length);
            let currentMissionTemp = missions[idx]; let correctAnswers = [];
            if (currentMissionTemp.type === 'divisor') { for(let i=1; i<=currentMissionTemp.target; i++) { if(currentMissionTemp.target % i === 0) correctAnswers.push(i); } } 
            else { for(let i=1; i<=6; i++) correctAnswers.push(currentMissionTemp.target * i); }

            let newOrbs = [];
            for (let i = 0; i < 20; i++) { 
                let x, y, valid = false, attempts = 0;
                while (!valid && attempts < 50) {
                    x = Math.random() * (MAP_WIDTH - 200) + 100; y = Math.random() * (MAP_HEIGHT - 200) + 100; valid = true;
                    for (let c of containers) { if (x > c.x - 20 && x < c.x + c.w + 20 && y > c.y - 20 && y < c.y + c.h + 20) { valid = false; break; } }
                    attempts++;
                }
                if (valid) newOrbs.push({ x: x, y: y, number: (i < 6) ? correctAnswers[Math.floor(Math.random() * correctAnswers.length)] : Math.floor(Math.random() * 30) + 1, id: 'orb_' + i + '_' + Date.now() }); 
            }
            db.ref(`rooms/${currentRoomId}/events/mission`).set({ index: idx, orbs: newOrbs });
        }

        function enterIngame(mode, playersData) {
            selectedGameMode = mode; showMenu(null); document.getElementById('game-container').style.display = 'block';

            if(selectedGameMode === 'domination') { document.getElementById('domination-ui').style.display = 'flex'; gameTimeRemaining = 300; domScores = {blue:0, red:0}; }

            initMap(); projectiles = []; meleeSlashes = []; orbs = []; supplyCrates = []; explosives = []; heartPacks = []; activeRealms = [];
            stats = { blue: { kills: 0, deaths: 0 }, red: { kills: 0, deaths: 0 } }; others = []; remotePlayers = {}; 
            isGameActive = false;

            for (const [uid, pData] of Object.entries(playersData || {})) {
                if (uid === myUid) { player = new Player(pData.team, false, pData.hero, pData.name || '유저'); myTeam = pData.team; } 
                else { 
                    let newP = new Player(pData.team, pData.isBot || false, pData.hero, pData.name);
                    if (!isSinglePlayer && !pData.isBot) { newP.isRemote = true; remotePlayers[uid] = newP; }
                    others.push(newP); 
                }
            }
            
            updateUI(); setupControls(); 
            
            if (isSinglePlayer) startNewMission();
            else {

                if (isHost) setTimeout(() => triggerNewMissionSync(), 500);

            startCountdown(() => { isGameActive = true; });

            currentState = GAME_STATE.PLAYING; lastTime = performance.now(); syncTimer = 0; 
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

        function startCountdown(callback) {
            const overlay = document.getElementById('countdown-overlay');
            overlay.style.display = 'flex';
            let count = 3;
            overlay.innerText = count;
            
            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    overlay.innerText = count;
                } else if (count === 0) {
                    overlay.innerText = 'START!';
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    callback();
                }
            }, 1000);
        }

        function setupMultiplayerListeners() {
            const eventsRef = db.ref(`rooms/${currentRoomId}/events`);
            
            eventsRef.child('killLogs').on('child_added', snap => {
                const data = snap.val();
                displayKillLog(data.killerName, data.killerTeam, data.victimName, data.victimTeam);
                
                if (data.victimTeam === 'blue') { stats.blue.deaths++; stats.red.kills++; } 
                else { stats.red.deaths++; stats.blue.kills++; }
                
                document.getElementById('score-blue-kill').innerText = stats.blue.kills; document.getElementById('score-blue-death').innerText = stats.blue.deaths;
                document.getElementById('score-red-kill').innerText = stats.red.kills; document.getElementById('score-red-death').innerText = stats.red.deaths;

                if (data.victimUid === myUid) {
                    if(!player.isDeadProcessed) { 
                        showModal("사망! 3초 후 리스폰됩니다."); closeQuiz();
                        player.hp = 0; player.x = -1000; player.targetX = -1000; player.isDeadProcessed = true;
                        if(player.realm) { player.realm.active = false; player.realm = null; }
                        setTimeout(() => { player.spawn(); updateUI(); }, 3000); updateUI();
                    }
                } else {
                    let deadP = remotePlayers[data.victimUid] || others.find(b => b.name === data.victimName);
                    if (deadP && !deadP.isDeadProcessed) { 
                        deadP.hp = 0; deadP.x = -1000; deadP.targetX = -1000; deadP.isDeadProcessed = true;
                        if(deadP.realm) { deadP.realm.active = false; deadP.realm = null; }
                        if (isHost && deadP.isBot) setTimeout(() => { deadP.spawn(); }, 3000);
                    }
                }
                
                if(data.killerName === player.name && data.victimTeam !== player.team) showModal("적을 처치했습니다!");
                checkGameEnd();
            });

            eventsRef.child('attacks').on('child_added', snap => {
                const data = snap.val(); if(data.uid === myUid) return;
                const p = remotePlayers[data.uid];
                if(p && !p.isDeadProcessed) p.fireProjectile(data.twX, data.twY);
            });

            // 🚨 핵심 교정 3: 궁극기, 지뢰, 수류탄, 점멸 등 상대방에게 안보이고 데미지도 없던 스킬 완벽 동기화
            eventsRef.child('skills').on('child_added', snap => {
                const data = snap.val(); if(data.uid === myUid) return;
                const p = remotePlayers[data.uid];
                if(!p || p.isDeadProcessed) return;

                if (data.type === 'grenade') {
                    explosives.push(new Explosive('grenade', p.x, p.y, p, data.finalX, data.finalY));
                } else if (data.type === 'mine') {
                    explosives.push(new Explosive('mine', data.finalX, data.finalY, p));
                } else if (data.type === 'ult_activate') {
                    p.ultActiveTimer = p.heroType === 'square' ? 5000 : 3000;
                } else if (data.type === 'ult_ninja') {
                    let t = [player, ...others].find(b => b.name === data.targetName);
                    if(t) activeRealms.push(new Realm(p, t));
                } else if (data.type === 'ult_hexagon') {
                    p.x = data.twX; p.y = data.twY; p.ultActiveTimer = 3000;
                } else if (data.type === 'flash') {
                    p.x = data.x; p.y = data.y; p.targetX = data.x; p.targetY = data.y;
                }
            });

            eventsRef.child('supplyCrates').on('child_added', snap => {
                const data = snap.val(); supplyCrates.push(new SupplyCrate(data.x, data.y, data.id));
                showAnnouncement("📦 보급이 투하되었습니다!");
            });

            eventsRef.child('mission').on('value', snap => {
                const data = snap.val(); if(!data) return;
                currentMission = missions[data.index];
                missionBanner.innerText = currentMission.text;
                missionBanner.classList.add('mission-pop'); setTimeout(() => missionBanner.classList.remove('mission-pop'), 300);
                orbs = data.orbs ? data.orbs.map(o => new ResourceOrb(o.x, o.y, o.number, o.id)) : [];
            });
            eventsRef.child('orbEaten').on('child_added', snap => {
                const eatenId = snap.val(); orbs = orbs.filter(o => o.id !== eatenId);
            });
        }

        function displayKillLog(kName, kTeam, vName, vTeam) {

        class DominationPoint {
            constructor() { this.x = 1600; this.y = 1200; this.radius = 250; this.owner = null; this.capturingTeam = null; this.captureProgress = 0; this.maxProgress = 3; }
            update(dt) {
                if(selectedGameMode !== 'domination') return;
                let bCount = 0, rCount = 0;
                for(let t of [player, ...others]) {
                    if(t && t.hp > 0 && Math.hypot(t.x - this.x, t.y - this.y) < this.radius) { if(t.team === 'blue') bCount++; else rCount++; }
                }
                let dominant = null;
                if(bCount > 0 && rCount === 0) dominant = 'blue'; else if(rCount > 0 && bCount === 0) dominant = 'red';

                if(dominant) {
                    if(this.capturingTeam !== dominant) { this.capturingTeam = dominant; this.captureProgress = 0; }
                    if(this.owner !== dominant) {
                        this.captureProgress += dt / 1000;
                        if(this.captureProgress >= this.maxProgress) { this.owner = dominant; this.captureProgress = 0; showAnnouncement(dominant === 'blue' ? "블루팀 거점 점령!" : "레드팀 거점 점령!"); }
                    }
                } else { this.capturingTeam = null; this.captureProgress = Math.max(0, this.captureProgress - dt/1000); }

                if(this.owner) domScores[this.owner] += dt / 1000;
            }
            draw(ctx) {
                if(selectedGameMode !== 'domination') return;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                let color = 'rgba(156, 163, 175, 0.2)';
                if(this.owner === 'blue') color = 'rgba(59, 130, 246, 0.3)'; else if(this.owner === 'red') color = 'rgba(239, 68, 68, 0.3)';
                ctx.fillStyle = color; ctx.fill();
                ctx.strokeStyle = this.owner === 'blue' ? '#3b82f6' : (this.owner === 'red' ? '#ef4444' : '#9ca3af');
                ctx.lineWidth = 6; ctx.stroke();
                
                if(this.capturingTeam && this.owner !== this.capturingTeam) {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, -Math.PI/2, -Math.PI/2 + (this.captureProgress/this.maxProgress)*Math.PI*2);
                    ctx.strokeStyle = this.capturingTeam === 'blue' ? '#60a5fa' : '#f87171'; ctx.lineWidth = 12; ctx.stroke();
                }
                ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '30px Jua'; ctx.textAlign = 'center'; ctx.fillText(this.owner ? (this.owner==='blue'?"블루팀 점령중":"레드팀 점령중") : "거점 (비어있음)", this.x, this.y);
            }
        }
        let domPoint = new DominationPoint();

        class Container {
            constructor(x, y, w, h, color) { this.x = x; this.y = y; this.w = w; this.h = h; this.color = color; this.searched = false; this.failedTeams = []; this.generateQuiz(); }
            generateQuiz() {
                let w = Math.floor(Math.random() * 15) + 5; let h = Math.floor(Math.random() * 15) + 5; let ansNum = w * h;
                let options = [ `${ansNum}cm²`, `${ansNum + 10}cm²`, `${w*2 + h*2}cm²`, `${ansNum - Math.min(10, ansNum-1)}cm²` ];
                options = [...new Set(options)]; while(options.length < 4) { options.push(`${ansNum + Math.floor(Math.random()*20)+1}cm²`); options = [...new Set(options)]; }
                options.sort(() => Math.random() - 0.5);
                this.quiz = { question: `가로 ${w}cm, 세로 ${h}cm 직사각형 넓이는?`, answer: `${ansNum}cm²`, options: options, type: 'container' };
            }
            draw(ctx) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(this.x + 8, this.y + 8, this.w, this.h);
                ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.w, this.h);
                for (let i = 12; i < this.w; i += 24) { ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(this.x + i, this.y); ctx.lineTo(this.x + i, this.y + this.h); ctx.stroke(); ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(this.x + i + 3, this.y); ctx.lineTo(this.x + i + 3, this.y + this.h); ctx.stroke(); }
                ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 5; ctx.strokeRect(this.x, this.y, this.w, this.h);
                ctx.fillStyle = '#111827'; let cw = 14; ctx.fillRect(this.x - 2, this.y - 2, cw, cw); ctx.fillRect(this.x + this.w - cw + 2, this.y - 2, cw, cw); ctx.fillRect(this.x - 2, this.y + this.h - cw + 2, cw, cw); ctx.fillRect(this.x + this.w - cw + 2, this.y + this.h - cw + 2, cw, cw);
            }
        }

        class RespawnZone {
            constructor(x, y, w, h, team) { this.x = x; this.y = y; this.w = w; this.h = h; this.team = team; }
            draw(ctx) {
                ctx.fillStyle = this.team === 'blue' ? 'rgba(59, 130, 246, 0.15)' : 'rgba(239, 68, 68, 0.15)'; ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = this.team === 'blue' ? 'rgba(59, 130, 246, 0.6)' : 'rgba(239, 68, 68, 0.6)'; ctx.setLineDash([10, 10]); ctx.lineWidth = 3; ctx.strokeRect(this.x, this.y, this.w, this.h); ctx.setLineDash([]);

        class ResourceOrb {

        class SupplyCrate {
            constructor(x, y, id) { this.x = x; this.y = y; this.radius = 40; this.id = id || ('crate_'+Date.now()); this.active = true; this.failedTeams = []; this.dropZ = 1200; this.generateQuiz(); }
            update(dt) { if (this.dropZ > 0) this.dropZ = Math.max(0, this.dropZ - dt * 1.8); }
            generateQuiz() {
                let a = Math.floor(Math.random()*15)+10; let b = Math.floor(Math.random()*15)+10; let c = Math.floor(Math.random()*5)+2; let ans = (a+b)*c;
                let options = [ ans.toString(), (ans+10).toString(), (ans-10).toString(), (ans+5).toString() ]; options.sort(() => Math.random() - 0.5);
                this.quiz = { question: `(${a} + ${b}) × ${c} = ?`, answer: ans.toString(), options: options, type: 'crate' };
            }
            draw(ctx) {
                if(!this.active) return;

                    ctx.beginPath(); ctx.moveTo(0, -w/2); ctx.lineTo(0, -w*1.5); ctx.stroke();

        class Realm {
